<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Interviewer</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<style>
  body { font-family: system-ui, sans-serif; max-width: 640px; margin: 40px auto; padding: 0 20px; }
  textarea { width: 100%; height: 160px; }
  button { padding: 10px 20px; font-size: 16px; margin-top: 10px; }
  #status { margin-top: 16px; font-weight: bold; }
  #timer { font-variant-numeric: tabular-nums; }
  table { border-collapse: collapse; width: 100%; margin-top: 10px; }
  td, th { border: 1px solid #ccc; padding: 6px 10px; text-align: left; font-size: 14px; }
</style>
</head>
<body>
  <h1>AI Interviewer</h1>

  <div id="setup">
    <textarea id="jobPosting" placeholder="Paste the job posting here..."></textarea><br>
    <button id="startBtn">Start Interview</button>
  </div>

  <div id="status"></div>
  <div id="timer"></div>
  <div id="results"></div>

  <script type="module">
    import Vapi from 'https://esm.sh/@vapi-ai/web@2.6.1';

    const MIN_JOB_POSTING_LENGTH = 100;

    const supabase = window.supabase.createClient(CONFIG.SUPABASE_URL, CONFIG.SUPABASE_PUBLISHABLE_KEY);
    const vapi = new Vapi(CONFIG.VAPI_PUBLIC_KEY);

    let sessionId = null;
    let rubric = null;
    let transcriptLog = [];
    let callStartTime = null;
    let timerInterval = null;
    let resultsChannel = null;

    const statusEl = document.getElementById('status');
    const timerEl = document.getElementById('timer');
    const resultsEl = document.getElementById('results');
    const startBtn = document.getElementById('startBtn');

    function setStatus(text) { statusEl.textContent = text; }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function startTimer() {
      callStartTime = Date.now();
      timerInterval = setInterval(() => {
        const secs = Math.floor((Date.now() - callStartTime) / 1000);
        const m = String(Math.floor(secs / 60)).padStart(2, '0');
        const s = String(secs % 60).padStart(2, '0');
        timerEl.textContent = `Call time: ${m}:${s} (Vapi bills per minute)`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    startBtn.addEventListener('click', async () => {
      const jobPosting = document.getElementById('jobPosting').value.trim();
      if (!jobPosting) {
        setStatus('Paste a job posting first.');
        return;
      }
      if (jobPosting.length < MIN_JOB_POSTING_LENGTH) {
        setStatus(`Paste the full job posting (at least ${MIN_JOB_POSTING_LENGTH} characters).`);
        return;
      }

      startBtn.disabled = true;
      setStatus('Generating questions...');

      let res;
      try {
        res = await fetch(`${CONFIG.N8N_BASE_URL}/generate-questions`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ jobPosting })
        });
      } catch (err) {
        setStatus('Failed to generate questions — check the n8n workflow and try again.');
        startBtn.disabled = false;
        return;
      }

      if (!res.ok) {
        setStatus('Failed to generate questions. Check the n8n workflow.');
        startBtn.disabled = false;
        return;
      }

      let data;
      try {
        data = await res.json();
      } catch (err) {
        setStatus('n8n returned an invalid response.');
        startBtn.disabled = false;
        return;
      }

      if (!data || !data.sessionId || !Array.isArray(data.questions) || !data.rubric) {
        setStatus('n8n returned an unexpected response — check the Respond to Webhook node is configured correctly.');
        startBtn.disabled = false;
        return;
      }

      sessionId = data.sessionId;
      rubric = data.rubric;

      subscribeToResults(sessionId);

      const systemPrompt = `You are a professional, warm recruiter conducting a 15-20 minute screening call. ` +
        `Ask the following questions ONE AT A TIME, in order, waiting for a full answer before moving on. ` +
        `Do not give feedback or scoring on answers — just a brief acknowledgment, then the next question. ` +
        `After the last question, thank the candidate and end the call.\n\nQuestions:\n` +
        data.questions.map((q, i) => `${i + 1}. ${q}`).join('\n');

      setStatus('Starting call...');
      try {
        await vapi.start({
          model: {
            provider: 'anthropic',
            model: 'claude-sonnet-5',
            messages: [{ role: 'system', content: systemPrompt }]
          },
          voice: {
            provider: 'vapi',
            voiceId: 'Elliot'
          },
          startSpeakingPlan: {
            waitSeconds: 4.5,
            smartEndpointingPlan: {
              provider: 'livekit'
            }
          },
          firstMessage: "Hi, thanks for making time today. Let's get started."
        });
      } catch (err) {
        setStatus('Could not start the call — check mic permission and your Vapi key.');
        startBtn.disabled = false;
      }
    });

    vapi.on('call-start', () => {
      setStatus('Interview in progress — speak naturally.');
      transcriptLog = [];
      startTimer();
    });

    vapi.on('message', (msg) => {
      if (msg.type === 'transcript' && msg.transcriptType === 'final') {
        const speaker = msg.role === 'assistant' ? 'Interviewer' : msg.role === 'user' ? 'Candidate' : msg.role;
        transcriptLog.push(`${speaker}: ${msg.transcript}`);
      }
    });

    vapi.on('call-end', async () => {
      stopTimer();
      setStatus('Call ended. Scoring your answers...');

      try {
        const res = await fetch(`${CONFIG.N8N_BASE_URL}/score-session`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            sessionId,
            rubric,
            transcript: transcriptLog.join('\n')
          })
        });

        if (!res.ok) {
          setStatus('Failed to submit for scoring — check the n8n workflow.');
          startBtn.disabled = false;
        }
      } catch (err) {
        setStatus('Failed to submit for scoring — check the n8n workflow.');
        startBtn.disabled = false;
      }
    });

    vapi.on('error', (e) => {
      stopTimer();
      setStatus('Call error — see browser console.');
      startBtn.disabled = false;
      console.error(e);
    });

    function subscribeToResults(id) {
      if (resultsChannel) {
        supabase.removeChannel(resultsChannel);
        resultsChannel = null;
      }
      resultsEl.innerHTML = '';

      resultsChannel = supabase
        .channel(`session-${id}`)
        .on('postgres_changes', {
          event: 'UPDATE',
          schema: 'public',
          table: 'interview_sessions',
          filter: `id=eq.${id}`
        }, (payload) => {
          if (payload.new.status === 'scored') {
            renderResults(payload.new.scorecard);
          }
        })
        .subscribe();
    }

    function renderResults(scorecard) {
      if (!scorecard || !Array.isArray(scorecard.perQuestion) || !Array.isArray(scorecard.top3Fixes)) {
        setStatus('Scoring finished but returned an unexpected shape — check the n8n scoring workflow.');
        startBtn.disabled = false;
        return;
      }

      setStatus(`Done. Overall score: ${scorecard.overallScore}/100`);
      let html = '<table><tr><th>Q</th><th>Score</th><th>Biggest Fix</th></tr>';
      scorecard.perQuestion.forEach((q, i) => {
        html += `<tr><td>Q${i + 1}</td><td>${escapeHtml(q.score)}</td><td>${escapeHtml(q.biggestFix)}</td></tr>`;
      });
      html += '</table><h3>Top 3 Fixes</h3><ul>' +
        scorecard.top3Fixes.map(f => `<li>${escapeHtml(f)}</li>`).join('') + '</ul>';
      resultsEl.innerHTML = html;
      startBtn.disabled = false;
    }
  </script>
</body>
</html>
